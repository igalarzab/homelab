---
name: Ansible lint

on:
  pull_request:
    paths:
      - "ansible/**"
      - ".github/workflows/ansible-lint.yml"
      - ".yamllint"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches:
      - main
    paths:
      - "ansible/**"
      - ".github/workflows/ansible-lint.yml"
      - ".yamllint"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

jobs:
  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Run ansible-lint
        run: uv run ansible-lint ansible
