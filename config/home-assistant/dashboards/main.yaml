---
title: Home
views:
  - title: Home
    path: home
    icon: mdi:home-outline
    type: sections
    max_columns: 3
    header:
      layout: responsive
      badges_position: bottom
      card:
        type: markdown
        text_only: true
        content: |-
          # Home
          {{ now().strftime('%A, %-d %B') }}
    badges:
      - type: entity
        entity: person.jose
        show_state: true
        name: Iñaki
        show_name: true
        show_entity_picture: true
      - type: entity
        entity: input_boolean.guests
        show_state: true
        name: Guests
        show_name: true
        visibility:
          - condition: state
            entity: input_boolean.guests
            state: 'on'
      - type: entity
        entity: input_boolean.holidays
        show_state: true
        name: Holiday mode
        show_name: true
        visibility:
          - condition: state
            entity: input_boolean.holidays
            state: 'on'
      - type: entity
        entity: sensor.unavailable_entities
        show_state: true
        name: Unavailable
        show_name: true
        visibility:
          - condition: numeric_state
            entity: sensor.unavailable_entities
            above: 0
        tap_action:
          action: navigate
          navigation_path: /main-dashboard/settings
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: tile
            entity: weather.forecast_home
            name: Outside
            state_content:
              - temperature
            tap_action:
              action: more-info
            icon_tap_action:
              action: more-info
            grid_options:
              columns: 6
              rows: 1
          - type: tile
            entity: input_button.wake_up
            name: Wake up
            icon: mdi:weather-sunset-up
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: input_button.press
              target:
                entity_id: input_button.wake_up
            icon_tap_action:
              action: perform-action
              perform_action: input_button.press
              target:
                entity_id: input_button.wake_up
            grid_options:
              columns: 6
              rows: 1
          - type: tile
            entity: input_button.go_to_sleep
            name: Good night
            icon: mdi:weather-night
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: input_button.press
              target:
                entity_id: input_button.go_to_sleep
            icon_tap_action:
              action: perform-action
              perform_action: input_button.press
              target:
                entity_id: input_button.go_to_sleep
            grid_options:
              columns: 6
              rows: 1
          - type: tile
            entity: input_button.pre_cool_home
            name: Pre-cool home
            icon: mdi:snowflake
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: input_button.press
              target:
                entity_id: input_button.pre_cool_home
            icon_tap_action:
              action: perform-action
              perform_action: input_button.press
              target:
                entity_id: input_button.pre_cool_home
            grid_options:
              columns: 6
              rows: 1
          - type: tile
            entity: input_button.vacuum_home
            name: Clean home
            icon: mdi:robot-vacuum
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: input_button.press
              target:
                entity_id: input_button.vacuum_home
            icon_tap_action:
              action: perform-action
              perform_action: input_button.press
              target:
                entity_id: input_button.vacuum_home
            grid_options:
              columns: 6
              rows: 1
          - type: tile
            entity: input_button.leave_home
            name: Leave home
            icon: mdi:exit-run
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: input_button.press
              target:
                entity_id: input_button.leave_home
            icon_tap_action:
              action: perform-action
              perform_action: input_button.press
              target:
                entity_id: input_button.leave_home
            grid_options:
              columns: 6
              rows: 1
      - type: grid
        cards:
          - type: heading
            heading: Entrance & hall
            heading_style: title
            icon: mdi:door-open
            tap_action:
              action: navigate
              navigation_path: /main-dashboard/entrance
          - type: picture-elements
            image: /local/room-atlas/entrance.svg?v=7
            elements:
              - type: state-label
                entity: sensor.living_room_thermometer_temperature
                title: Temperature
                style:
                  left: 6%
                  top: 37%
                  transform: translate(0, -50%)
                  color: var(--primary-text-color)
                  font-size: clamp(24px, 2vw, 32px)
                  font-weight: '500'
                  padding: '0'
                  line-height: '1.2'
                tap_action:
                  action: more-info
              - type: state-label
                entity: sensor.living_room_thermometer_humidity
                title: Humidity
                style:
                  left: 6%
                  top: 77%
                  transform: translate(0, -50%)
                  color: var(--primary-text-color)
                  font-size: 20px
                  font-weight: '500'
                  padding: '0'
                  line-height: '1.2'
                tap_action:
                  action: more-info
              - type: conditional
                conditions:
                  - entity: binary_sensor.entrance_motion_occupancy
                    state: 'on'
                elements:
                  - type: state-icon
                    entity: binary_sensor.entrance_motion_occupancy
                    icon: mdi:account
                    title: Occupied
                    state_color: false
                    style:
                      left: 83%
                      top: 77%
                      --mdc-icon-size: 28px
                      padding: 4px
                      border-radius: 50%
                      color: var(--card-background-color)
                      --state-icon-color: var(--card-background-color)
                      background: var(--primary-text-color)
                      border: 1px solid var(--divider-color)
                    tap_action:
                      action: more-info
              - type: conditional
                conditions:
                  - entity: binary_sensor.entrance_motion_occupancy
                    state: 'off'
                elements:
                  - type: state-icon
                    entity: binary_sensor.entrance_motion_occupancy
                    icon: mdi:account-off-outline
                    title: Clear
                    state_color: false
                    style:
                      left: 83%
                      top: 77%
                      --mdc-icon-size: 28px
                      padding: 4px
                      border-radius: 50%
                      color: var(--secondary-text-color)
                      --state-icon-color: var(--secondary-text-color)
                      background: var(--card-background-color)
                      border: 1px solid var(--divider-color)
                    tap_action:
                      action: more-info
              - type: conditional
                conditions:
                  - entity: binary_sensor.entrance_motion_occupancy
                    state_not: 'on'
                  - entity: binary_sensor.entrance_motion_occupancy
                    state_not: 'off'
                elements:
                  - type: state-icon
                    entity: binary_sensor.entrance_motion_occupancy
                    icon: mdi:account-question-outline
                    title: Occupancy unavailable
                    state_color: false
                    style:
                      left: 83%
                      top: 77%
                      --mdc-icon-size: 28px
                      padding: 4px
                      border-radius: 50%
                      color: var(--secondary-text-color)
                      --state-icon-color: var(--secondary-text-color)
                      background: var(--card-background-color)
                      border: 1px solid var(--divider-color)
                    tap_action:
                      action: more-info
              - type: icon
                icon: mdi:arrow-top-right
                title: Open Entrance & hall
                style:
                  right: 3%
                  top: 10%
                  transform: none
                  color: var(--primary-text-color)
                  --mdc-icon-size: 22px
                  padding: 10px
                  background: var(--card-background-color)
                  border-radius: 50%
                tap_action:
                  action: navigate
                  navigation_path: /main-dashboard/entrance
            grid_options:
              columns: 12
              rows: auto
            dark_mode_image: /local/room-atlas/entrance-dark.svg?v=7
          - type: tile
            entity: switch.entrance_controller_wall_gang_one
            name: Entrance light
            icon: mdi:lightbulb-outline
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - type: tile
            entity: switch.living_room_controller_wall_gang_three
            name: Hall light
            icon: mdi:lightbulb-outline
            tap_action:
              action: toggle
