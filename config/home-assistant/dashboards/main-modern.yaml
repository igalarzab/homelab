            entity: input_boolean.guests
            name: Guests
            icon: mdi:account-multiple-outline
            color: teal
          - type: tile
            entity: input_boolean.holidays
            name: Holiday mode
            icon: mdi:beach
            color: blue
          - type: tile
            entity: input_boolean.jose_travelling
            name: Travelling
            icon: mdi:airplane
            color: blue
          - type: tile
            entity: input_boolean.home_locked
            name: Away mode
            icon: mdi:home-export-outline
            color: blue
          - type: tile
            entity: input_boolean.home_vacuumed
            name: Cleaned today
            icon: mdi:robot-vacuum
            color: teal
      - type: grid
        cards:
          - type: heading
            heading: Automations
            heading_style: title
            icon: mdi:auto-fix
          - type: tile
            entity: input_boolean.home_ac_automations
            name: Automatic cooling
            icon: mdi:air-conditioner
            color: blue
            features:
              - type: toggle
            features_position: inline
            grid_options:
              columns: 12
          - type: tile
            entity: input_boolean.home_light_automations
            name: Automatic lighting
            icon: mdi:lightbulb-auto-outline
            color: amber
            features:
              - type: toggle
            features_position: inline
            grid_options:
              columns: 12
          - type: tile
            entity: input_number.too_hot
            name: Cooling threshold
            icon: mdi:thermometer
            color: orange
            features:
              - type: numeric-input
            grid_options:
              columns: 12
      - type: grid
        cards:
          - type: heading
            heading: Device health
            heading_style: title
            icon: mdi:heart-pulse
          - type: tile
            entity: sensor.unavailable_entities
            name: Unavailable devices
            icon: mdi:lan-disconnect
            color: orange
            grid_options:
              columns: 12
          - type: markdown
            title: Devices needing attention
            content: |-
              {% set count = states('sensor.unavailable_entities') | int(-1) %}
              {% set devices = state_attr('group.unavailable_entities', 'entity_id') or [] %}
              {% if count < 0 %}
              Device availability is not ready yet.
              {% elif devices | length > 0 %}
              {% for entity in devices %}
              - {{ state_attr(entity, 'friendly_name') or entity }}
              {% endfor %}
              {% elif count > 0 %}
              The device list is updating.
              {% else %}
              No unavailable devices reported.
              {% endif %}
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.current_version
            name: Installed version
            grid_options:
              columns: 12
      - type: grid
        cards:
          - type: heading
            heading: Timers
            heading_style: title
            icon: mdi:timer-outline
          - type: entities
            title: Automatic lights
            show_header_toggle: false
            state_color: true
            entities:
              - entity: timer.entrance_automatic_lights_timer
                name: Entrance
              - entity: timer.hall_automatic_lights_timer
                name: Hall
              - entity: timer.living_room_automatic_lights_timer
                name: Living room
              - entity: timer.kitchen_automatic_lights_timer
                name: Kitchen
              - entity: timer.office_automatic_lights_timer
                name: Office
              - entity: timer.bedroom_automatic_lights_timer
                name: Bedroom
              - entity: timer.bathroom_automatic_lights_timer
                name: Bathroom
            grid_options:
              columns: 12
          - type: tile
            entity: timer.bedroom_sleeping
            name: Sleep timer
            grid_options:
              columns: 12
