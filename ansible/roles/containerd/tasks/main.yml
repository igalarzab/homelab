---
# The repository entry references this dearmored key path, so keep producing it here
- name: Get docker apt key  # noqa: command-instead-of-module
  become: true
  ansible.builtin.shell: "set -o pipefail && curl -fsSL {{ containerd_docker_apt_key_url }} | gpg --dearmor -o {{ containerd_docker_apt_key_path }}"
  args:
    creates: "{{ containerd_docker_apt_key_path }}"
    executable: /bin/bash

- name: Add docker repository
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [signed-by={{ containerd_docker_apt_key_path }}] {{ containerd_docker_apt_repo_url }}"
    state: present
    filename: k8s
    update_cache: true

- name: Install containerd packages
  become: true
  notify: containerd_restart
  ansible.builtin.package:
    state: present
    name:
      - containerd.io

- name: Store containerd config
  become: true
  notify: containerd_restart
  ansible.builtin.template:
    src: templates/containerd-config.toml.j2
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: "0644"

- name: Store crictl config
  become: true
  notify: containerd_restart
  ansible.builtin.template:
    src: templates/crictl.yaml.j2
    dest: /etc/crictl.yaml
    owner: root
    group: root
    mode: "0644"

- name: Enable containerd service
  become: true
  ansible.builtin.service:
    name: containerd
    state: started
    enabled: true

- name: Restart containerd now
  become: true
  ansible.builtin.meta: flush_handlers
