---
#
# Remote server configuration
#

- name: Ensure .kube directory exists on remote server
  ansible.builtin.file:
    path: ~/.kube
    state: directory
    mode: "0755"

- name: Get current user name from remote config
  become: true
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - config
      - view
      - -o
      - jsonpath={.users[0].name}
  register: kubeadm_current_user
  changed_when: false

- name: Rename user to admin@hostname in remote config
  become: true
  ansible.builtin.replace:
    path: /etc/kubernetes/admin.conf
    regexp: kubernetes-admin
    replace: "admin@{{ kubeadm_cluster_name }}"
  when: kubeadm_current_user.stdout == 'kubernetes-admin'

- name: Get current context name from remote config
  become: true
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - config
      - current-context
  register: kubeadm_current_context
  changed_when: false

- name: Rename context to hostname in remote config
  become: true
  changed_when: true
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - config
      - rename-context
      - "{{ kubeadm_current_context.stdout }}"
      - "{{ kubeadm_cluster_name }}"
  when: kubeadm_current_context.stdout != kubeadm_cluster_name

- name: Copy kubectl config to remote user
  become: true
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "{{ ansible_facts['env']['HOME'] }}/.kube/config"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0644"
    remote_src: true

#
# Local machine configuration
#

- name: Ensure .kube directory exists locally
  delegate_to: localhost
  ansible.builtin.file:
    path: ~/.kube
    state: directory
    mode: "0700"

- name: Check if cluster already exists in local kubeconfig
  delegate_to: localhost
  ansible.builtin.command:
    argv:
      - kubectl
      - config
      - get-clusters
  register: kubeadm_local_clusters
  changed_when: false
  failed_when: false

- name: Download and merge kubeconfig locally
  when: kubeadm_cluster_name not in (kubeadm_local_clusters.stdout_lines | default([]))
  block:
    - name: Download admin.conf to temporary location
      become: true
      ansible.builtin.fetch:
        src: /etc/kubernetes/admin.conf
        dest: /tmp/kubernetes-admin.conf
        flat: true

    - name: Merge cluster configuration into local kubeconfig
      delegate_to: localhost
      changed_when: true
      ansible.builtin.shell: |
        KUBECONFIG=~/.kube/config:/tmp/kubernetes-admin.conf kubectl config view --flatten > /tmp/merged-config
        mv /tmp/merged-config ~/.kube/config
        chmod 0600 ~/.kube/config
        rm -f /tmp/kubernetes-admin.conf
      args:
        executable: /bin/bash

- name: Set context to the cluster
  delegate_to: localhost
  ansible.builtin.command:
    argv:
      - kubectl
      - config
      - use-context
      - "{{ kubeadm_cluster_name }}"
  changed_when: false
  failed_when: false
