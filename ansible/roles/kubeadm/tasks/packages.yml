---
# The repository entry references this dearmored key path, so keep producing it here
- name: Get k8s apt key  # noqa: command-instead-of-module
  become: true
  ansible.builtin.shell: "set -o pipefail && curl -fsSL {{ kubeadm_apt_key_url }} | gpg --dearmor -o {{ kubeadm_apt_key_path }}"
  args:
    creates: "{{ kubeadm_apt_key_path }}"
    executable: /bin/bash

- name: Add k8s repository
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [signed-by={{ kubeadm_apt_key_path }}] {{ kubeadm_apt_repo_url }} /"
    state: present
    update_cache: true
    filename: k8s

- name: Pin k8s packages
  become: true
  ansible.builtin.template:
    src: apt-pin.j2
    dest: /etc/apt/preferences.d/k8s
    owner: root
    group: root
    mode: "0644"

# latest moves the packages to the pinned version when kubeadm_full_version changes
- name: Install k8s packages  # noqa: package-latest
  become: true
  notify: kubeadm_restart_kubelet
  ansible.builtin.package:
    state: latest
    name:
      - kubeadm
      - kubectl
      - kubelet
      - kubernetes-cni

- name: Enable the kubelet service
  become: true
  ansible.builtin.service:
    name: kubelet
    state: started
    enabled: true
