---
- name: Ensure kubernetes directory exists
  become: true
  ansible.builtin.file:
    path: /etc/kubernetes
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy config file for kubeadm
  become: true
  ansible.builtin.template:
    src: kubeadm-config.yml.j2
    dest: /etc/kubernetes/kubeadm-config.yml
    owner: root
    group: root
    mode: "0644"
  notify:
    - kubeadm_restart_kubelet

- name: Check if the cluster has been already initialised
  become: true
  register: kubeadm_already_initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf

- name: Initialize k8s control plane
  become: true
  register: kubeadm_init
  changed_when: true
  when: not kubeadm_already_initialized.stat.exists
  ansible.builtin.command: kubeadm init --config /etc/kubernetes/kubeadm-config.yml

- name: Control plane output
  when: not kubeadm_already_initialized.stat.exists
  ansible.builtin.debug:
    var: kubeadm_init.stdout
