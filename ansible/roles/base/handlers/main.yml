---
- name: Restart SSH
  listen: base_restart_ssh
  become: true
  ansible.builtin.service:
    name: ssh
    state: restarted

- name: Restart fail2ban
  listen: base_restart_fail2ban
  become: true
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Reload base firewall
  listen: base_reload_ufw
  become: true
  community.general.ufw:
    state: reloaded
