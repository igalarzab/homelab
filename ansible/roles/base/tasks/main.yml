---
- name: Checking Operative System (only Debian compatible)
  ansible.builtin.meta: end_play
  when: ansible_facts['os_family'] != 'Debian'

- name: Set the main gid to the users group
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    group: users

- name: Delete the default user group
  become: true
  ansible.builtin.group:
    name: "{{ ansible_facts['user_id'] }}"
    state: absent

- name: Re-run facts
  ansible.builtin.setup:

- name: Update apt repos
  become: true
  ansible.builtin.apt:
    update_cache: true
    force_apt_get: true
    cache_valid_time: 3600

- name: Upgrade all apt packages
  become: true
  ansible.builtin.apt:
    upgrade: full

# The full upgrade above already keeps installed packages current
- name: Install base packages
  become: true
  ansible.builtin.package:
    state: present
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - git
      - gpg
      - jq
      - libseccomp2
      - lm-sensors
      - locales
      - openssh-client
      - pigz
      - python3
      - qemu-guest-agent
      - ripgrep
      - rsync
      - tar
      - tmux
      - tree
      - unattended-upgrades
      - unzip
      - util-linux
      - vim
      - zip

- name: Check for the QEMU guest agent channel
  ansible.builtin.stat:
    path: /dev/virtio-ports/org.qemu.guest_agent.0
  register: base_guest_agent_channel

- name: Enable the guest agent on Proxmox QEMU guests
  become: true
  ansible.builtin.systemd_service:
    name: qemu-guest-agent
    enabled: true
    state: started
  when: base_guest_agent_channel.stat.exists

- name: Install locales
  become: true
  community.general.locale_gen:
    name: "{{ item }}"
    state: present
  loop:
    - en_US.UTF-8
    - en_GB.UTF-8
    - es_ES.UTF-8
    - "{{ base_locale }}"

- name: Customize the motd message
  become: true
  ansible.builtin.file:
    path: /etc/update-motd.d/{{ item.file }}
    state: absent
  loop:
    - { file: 10-help-text }
    - { file: 50-motd-news }

- name: Disable swap
  become: true
  changed_when: true
  ansible.builtin.command: swapoff -a
  when:
    - base_disable_swap
    - ansible_facts['memory_mb']['swap']['total'] > 0

- name: Disable swap permanently
  become: true
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: "^([^#].*?\\sswap\\s+sw\\s+.*)$"
    replace: "# \\1"
  when: base_disable_swap

- name: Running networking tasks
  ansible.builtin.import_tasks: network.yml

- name: Running SSH hardening tasks
  ansible.builtin.import_tasks: ssh.yml

- name: Running security tasks
  ansible.builtin.import_tasks: security.yml

- name: Configure firewall
  ansible.builtin.import_tasks: firewall.yml
  when: base_enable_ufw
