---
- name: Install basic network packages
  become: true
  ansible.builtin.package:
    state: present
    name:
      - dnsutils
      - net-tools
      - nfs-common

- name: Install fail2ban
  become: true
  ansible.builtin.package:
    state: present
    name: fail2ban

- name: Configure fail2ban for SSH
  become: true
  notify: base_restart_fail2ban
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    content: |
      [DEFAULT]
      bantime = 3600
      findtime = 600
      maxretry = 5

      [sshd]
      enabled = true
      port = ssh

- name: Enable and start fail2ban service
  become: true
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
