---
- name: Install development tools
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    state: present
    name:
      - acl
      - build-essential
      - dbus-user-session
      - pkg-config
      - python3-debian

- name: Configure the GitHub CLI repository
  become: true
  register: t3code_gh_repository
  ansible.builtin.deb822_repository:
    name: github-cli
    types: deb
    uris: https://cli.github.com/packages
    suites: stable
    components: main
    signed_by: https://cli.github.com/packages/githubcli-archive-keyring.gpg

- name: Install the GitHub CLI
  become: true
  ansible.builtin.apt:
    name: gh
    state: present
    update_cache: true
    cache_valid_time: "{{ 0 if t3code_gh_repository.changed else 3600 }}"

- name: Configure the development user with Docker access
  become: true
  register: t3code_account
  ansible.builtin.user:
    name: "{{ t3code_user }}"
    group: users
    groups: docker
    append: true
    home: "{{ t3code_home }}"
    create_home: true

- name: Create the workspace and tool directories
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ t3code_user }}"
    group: users
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - path: "{{ t3code_home }}"
    - path: "{{ t3code_workspace }}"
    - path: "{{ t3code_home }}/.local/bin"
    - path: "{{ t3code_home }}/.local/share"
    - path: "{{ t3code_home }}/.cache"
    - path: "{{ t3code_home }}/.config"
    # Ansible's remote_tmp for tasks run as the development user
    - path: "{{ t3code_home }}/.ansible/tmp"
      mode: "0700"
    # T3's database and sign-in tokens
    - path: "{{ t3code_data_dir }}"
      mode: "0700"
  loop_control:
    label: "{{ item.path }}"

- name: Configure the machine-local environment
  become: true
  become_user: "{{ t3code_user }}"
  ansible.builtin.blockinfile:
    path: "{{ t3code_home }}/.config/local.sh"
    create: true
    mode: "0600"
    marker: "# {mark} ANSIBLE T3 CODE ENVIRONMENT"
    block: |
      export T3CODE_HOME={{ t3code_data_dir | quote }}

- name: Load the machine-local environment in Bash
  become: true
  become_user: "{{ t3code_user }}"
  ansible.builtin.blockinfile:
    path: "{{ t3code_home }}/{{ item }}"
    create: true
    mode: "0644"
    marker: "# {mark} ANSIBLE T3 CODE ENVIRONMENT"
    block: |
      . "$HOME/.config/local.sh"
  loop:
    - .profile
    - .bashrc

- name: Install personal tools and configuration
  ansible.builtin.import_tasks: dotfiles.yml

- name: Install coding agent CLIs
  ansible.builtin.include_tasks: provider.yml
  loop:
    - name: Codex
      command: codex
      installer_url: https://chatgpt.com/codex/install.sh
      interpreter: sh
    - name: Claude Code
      command: claude
      installer_url: https://claude.ai/install.sh
      interpreter: bash
  loop_control:
    loop_var: t3code_provider
    label: "{{ t3code_provider.name }}"

- name: Install and configure T3 Code
  ansible.builtin.import_tasks: t3code.yml
