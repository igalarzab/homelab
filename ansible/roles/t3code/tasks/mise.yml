---
- name: Install the external repository manager
  become: true
  ansible.builtin.apt:
    name: extrepo
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable the mise APT repository
  become: true
  register: t3code_mise_repository
  ansible.builtin.command:
    creates: /etc/apt/sources.list.d/extrepo_mise.sources
    argv:
      - extrepo
      - enable
      - mise

- name: Install mise from APT
  become: true
  ansible.builtin.apt:
    name: mise
    state: present
    update_cache: true
    cache_valid_time: "{{ 0 if t3code_mise_repository.changed else 3600 }}"

- name: Set up mise as the development user
  become: true
  become_user: "{{ t3code_user }}"
  environment:
    HOME: "/home/{{ t3code_user }}"
    PATH: "/home/{{ t3code_user }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
  block:
    - name: Bootstrap language tools without replacing existing selections
      ansible.builtin.command:
        argv:
          - /usr/bin/mise
          - use
          - --global
          - --yes
          - "{{ item.tool }}"
        chdir: "/home/{{ t3code_user }}"
        creates: "/home/{{ t3code_user }}/.local/share/mise/shims/{{ item.command }}"
      loop: "{{ t3code_tools }}"

    - name: Activate mise in login and interactive shells
      ansible.builtin.blockinfile:
        path: "/home/{{ t3code_user }}/{{ item.file }}"
        create: true
        mode: "0644"
        marker: "# {mark} ANSIBLE T3 CODE TOOLS"
        block: '{{ item.activation }}'
      loop:
        - file: .profile
          activation: 'eval "$(/usr/bin/mise activate bash --shims)"'
        - file: .bashrc
          activation: 'eval "$(/usr/bin/mise activate bash)"'
