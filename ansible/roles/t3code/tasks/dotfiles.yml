---
- name: Set up dotfiles as the development user
  become: true
  become_user: "{{ t3code_user }}"
  environment:
    HOME: "{{ t3code_home }}"
    PATH: "{{ t3code_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
  block:
    - name: Check out dotfiles
      ansible.builtin.git:
        repo: https://github.com/igalarzab/dotfiles.git
        dest: "{{ t3code_dotfiles_dir }}"
        version: "{{ t3code_dotfiles_version }}"
        recursive: true
        force: false

    - name: Install dotfiles and personal tools
      changed_when: true
      ansible.builtin.command:
        argv:
          - ./install
        chdir: "{{ t3code_dotfiles_dir }}"
