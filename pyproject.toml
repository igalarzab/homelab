[project]
name = "homelab"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
  "ansible>=14.5.0",
  "kubernetes>=37.0.1",
]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
  "actionlint-py>=1.7.12.25",
  "ansible-lint>=26.10.1",
  "ruff>=0.17.3",
  "shellcheck-py>=0.11.0.1",
]
