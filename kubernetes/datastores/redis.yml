---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-5.1.0/charts/other/app-template/values.schema.json

controllers:
  redis:
    type: statefulset
    pod:
      hostUsers: false
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
    containers:
      redis:
        image:
          repository: redis
          tag: "8.4.0-alpine"
        args:
          - redis-server
          - --appendonly
          - "yes"
          - --save
          - "60"
          - "1"
          - --maxmemory-policy
          - noeviction
          - --requirepass
          - $$(REDIS_PASSWORD)
        env:
          REDIS_PASSWORD: "${DATASTORE_REDIS_PASSWORD}"
        ports:
          - name: redis
            protocol: TCP
            containerPort: 6379
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - sh
                  - -c
                  - REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli -e ping
              initialDelaySeconds: 10
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 6
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - sh
                  - -c
                  - REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli -e ping
              initialDelaySeconds: 5
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 6

service:
  redis:
    controller: redis
    ports:
      redis:
        port: 6379
        protocol: TCP
        targetPort: redis

persistence:
  data:
    type: persistentVolumeClaim
    storageClass: local-path-retain
    accessMode: ReadWriteOnce
    size: 10Gi
    advancedMounts:
      redis:
        redis:
          - path: /data
