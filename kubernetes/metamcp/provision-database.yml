---
apiVersion: batch/v1
kind: Job
metadata:
  name: metamcp-database-init
  namespace: metamcp
spec:
  activeDeadlineSeconds: 120
  backoffLimit: 1
  template:
    spec:
      hostUsers: false
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: provision-database
          image: postgres:18.6-alpine
          env:
            - name: PGHOST
              value: postgresql.datastores.svc.cluster.local
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              value: "${DATASTORE_POSTGRESQL_PASSWORD}"
            - name: PGCONNECT_TIMEOUT
              value: "10"
            - name: METAMCP_POSTGRES_PASSWORD
              value: "${METAMCP_POSTGRES_PASSWORD}"
          command: ["/bin/sh", "-ec"]
          args:
            - |
              psql --no-psqlrc --set=ON_ERROR_STOP=1 --dbname=postgres <<'SQL'
              \getenv app_password METAMCP_POSTGRES_PASSWORD
              SELECT 'CREATE ROLE metamcp LOGIN'
              WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'metamcp')
              \gexec
              ALTER ROLE metamcp WITH LOGIN PASSWORD :'app_password';
              SELECT 'CREATE DATABASE metamcp OWNER metamcp'
              WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'metamcp')
              \gexec
              SQL
