---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-5.2.1/charts/other/app-template/values.schema.json

controllers:
  t3code:
    type: deployment
    replicas: 1
    strategy: Recreate
    pod:
      hostUsers: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          # Chrome's browser sandbox creates nested user/mount namespaces.
          type: Unconfined
    containers:
      t3code:
        image:
          repository: "${T3CODE_IMAGE_REPOSITORY}"
          tag: "${T3CODE_IMAGE_TAG}"
        env:
          TZ: ${COMMON_TZ}
          T3CODE_CHANNEL: stable
          T3CODE_UPDATE_ON_START: "true"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
          limits:
            cpu: "4"
            memory: 8Gi
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command: [curl, -fsS, -o, /dev/null, "http://127.0.0.1:3773/"]
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 120
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command: [curl, -fsS, -o, /dev/null, "http://127.0.0.1:3773/"]
              periodSeconds: 10
              timeoutSeconds: 3
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command: [curl, -fsS, -o, /dev/null, "http://127.0.0.1:3773/"]
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 5

service: {}

persistence:
  home:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 20Gi
    advancedMounts:
      t3code:
        t3code:
          - path: /home/node
  workspace:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 50Gi
    advancedMounts:
      t3code:
        t3code:
          - path: /workspace
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
  shm:
    type: emptyDir
    medium: Memory
    sizeLimit: 1Gi
    globalMounts:
      - path: /dev/shm
